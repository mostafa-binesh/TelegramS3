[package]
name = "telegram-s3"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Telegram-backed S3-compatible object storage"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
grammers-client = { version = "0.10", features = ["proxy"] }
grammers-mtsender = { version = "0.10", features = ["proxy"] }
grammers-session = "0.10"
grammers-tl-types = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = "0.23"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["serde", "v4"] }
webpki-roots = "0.26"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
